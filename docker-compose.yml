services:
  node_a:
    build: .
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - PEER_URL=http://node_b:3001
      - SYNC_DIR=/app/sync_dir
      - MAX_FILE_SIZE=10485760
      - RATE_LIMIT_MAX=20
      - RATE_LIMIT_TIME_WINDOW=10000
      - SYNC_SECRET=p2p-sync-secret-key
    volumes:
      - ./sync_dir_a:/app/sync_dir
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  node_b:
    build: .
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - PEER_URL=http://node_a:3000
      - SYNC_DIR=/app/sync_dir
      - MAX_FILE_SIZE=10485760
      - RATE_LIMIT_MAX=20
      - RATE_LIMIT_TIME_WINDOW=10000
      - SYNC_SECRET=p2p-sync-secret-key
    volumes:
      - ./sync_dir_b:/app/sync_dir
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
